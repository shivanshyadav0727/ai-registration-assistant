<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Registration Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        #chat {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin: 12px 0;
            padding: 12px 15px;
            border-radius: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .bot {
            background: #eef1f4;
            text-align: left;
        }

        .user {
            background: #222;
            color: white;
            text-align: right;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 15px;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .status {
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AI Registration Assistant</h1>
        <p>AI & Data Science Internship Registration</p>
    </div>

    <div id="chat"></div>

    <div class="status" id="status">
        Ready
    </div>

    <div class="input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            autocomplete="off"
        >
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const statusText = document.getElementById("status");

    function addMessage(text, type) {
        const message = document.createElement("div");
        message.className = "message " + type;
        message.textContent = text;
        chat.appendChild(message);
        chat.scrollTop = chat.scrollHeight;
    }

    async function startAssistant() {
        try {
            statusText.textContent = "Connecting...";

            const response = await fetch("/api/start", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            });

            const data = await response.json();

            addMessage(data.response, "bot");
            statusText.textContent = "Online";

        } catch (error) {
            addMessage("Unable to connect to the assistant.", "bot");
            statusText.textContent = "Connection error";
        }
    }

    async function sendMessage() {
        const message = input.value.trim();

        if (!message) {
            return;
        }

        addMessage(message, "user");
        input.value = "";
        statusText.textContent = "Assistant is typing...";

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            });

            const data = await response.json();

            addMessage(data.response, "bot");
            statusText.textContent = "Online";

        } catch (error) {
            addMessage("Something went wrong. Please try again.", "bot");
            statusText.textContent = "Connection error";
        }
    }

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    startAssistant();
</script>

</body>
</html>
